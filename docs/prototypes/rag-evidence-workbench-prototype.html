<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>排水规范证据助手｜界面原型</title>
  <!-- PROTOTYPE: Three UI variants, switchable via ?variant=A|B|C. Throwaway design exploration, not production code. -->
  <style>
    :root {
      --ink: #17221d;
      --muted: #65746d;
      --line: #d8e0dc;
      --paper: #f7f8f5;
      --panel: #ffffff;
      --green: #0b6647;
      --green-2: #e4f2eb;
      --lime: #c9f05b;
      --amber: #9a6200;
      --amber-bg: #fff3d6;
      --red: #a3382f;
      --red-bg: #fae8e5;
      --blue: #235c86;
      --blue-bg: #e6f1f8;
      --shadow: 0 12px 34px rgba(26, 42, 34, .10);
      --radius: 14px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; color: var(--ink); background: var(--paper); }
    body { font-family: Inter, "Microsoft YaHei", "PingFang SC", system-ui, sans-serif; }
    button, input { font: inherit; }
    button { color: inherit; }
    .hidden { display: none !important; }
    .app { min-height: 100vh; padding-bottom: 88px; }
    .topbar {
      height: 64px; padding: 0 24px; display: flex; align-items: center; gap: 18px;
      background: #10251c; color: white; border-bottom: 1px solid #274438;
    }
    .brand { display: flex; align-items: center; gap: 11px; min-width: 250px; }
    .brand-mark { width: 34px; height: 34px; border: 1px solid #5a7a6c; border-radius: 9px; display: grid; place-items: center; color: var(--lime); }
    .brand strong { font-size: 15px; letter-spacing: .02em; }
    .brand small { display: block; color: #aabdb4; margin-top: 2px; font-size: 11px; }
    .session-context { flex: 1; max-width: 820px; margin: auto; min-width: 0; }
    .session-context strong { display: block; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .session-context span { display: block; margin-top: 3px; color: #aabdb4; font-size: 10px; }
    .querybar { flex: 1; max-width: 850px; margin: auto; display: flex; gap: 8px; }
    .querybar input { width: 100%; height: 39px; border: 1px solid #486257; border-radius: 10px; background: #1d352b; color: white; padding: 0 13px; outline: none; }
    .querybar input:focus { border-color: var(--lime); }
    .primary { border: 0; border-radius: 9px; background: var(--lime); color: #183020; font-weight: 750; padding: 0 18px; cursor: pointer; }
    .demo-tag { font-size: 11px; padding: 5px 8px; border: 1px solid #4e695e; color: #bdd1c7; border-radius: 999px; white-space: nowrap; }
    .scenario-strip { min-height: 45px; padding: 7px 24px; background: #edf1ed; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 7px; overflow-x: auto; }
    .scenario-strip > span { color: var(--muted); font-size: 12px; margin-right: 3px; white-space: nowrap; }
    .scenario { border: 1px solid #cbd5d0; background: white; border-radius: 999px; padding: 7px 11px; cursor: pointer; white-space: nowrap; font-size: 12px; }
    .scenario.active { background: #163b2b; color: white; border-color: #163b2b; }
    .prototype-note { font-size: 11px; color: var(--muted); margin-left: auto; white-space: nowrap; }

    .pane-title { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 15px; }
    .pane-title h2, .pane-title h3 { margin: 0; font-size: 14px; }
    .eyebrow { margin: 0 0 8px; color: var(--green); text-transform: uppercase; letter-spacing: .12em; font-size: 10px; font-weight: 800; }
    .muted { color: var(--muted); }
    .tiny { font-size: 11px; }
    .icon-btn { width: 31px; height: 31px; border: 1px solid var(--line); border-radius: 8px; background: white; cursor: pointer; }
    .chip { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); border-radius: 999px; padding: 5px 8px; font-size: 11px; background: white; }
    .chip.green { color: var(--green); background: var(--green-2); border-color: #bfddce; }
    .chip.amber { color: var(--amber); background: var(--amber-bg); border-color: #ead29a; }
    .chip.red { color: var(--red); background: var(--red-bg); border-color: #e8bdb8; }
    .chip.blue { color: var(--blue); background: var(--blue-bg); border-color: #bfd9e8; }
    .status-box { border-left: 4px solid var(--green); background: var(--green-2); padding: 12px 14px; border-radius: 4px 10px 10px 4px; margin-bottom: 17px; }
    .status-box.amber { border-color: #d68a05; background: var(--amber-bg); }
    .status-box.red { border-color: #c95046; background: var(--red-bg); }
    .status-box.blue { border-color: #4081ad; background: var(--blue-bg); }
    .status-box strong { display: block; font-size: 13px; margin-bottom: 3px; }
    .status-box span { font-size: 12px; color: #4c5b54; }
    .answer h1 { font-family: Georgia, "Songti SC", serif; font-size: 27px; line-height: 1.3; margin: 0 0 16px; font-weight: 650; }
    .answer p { font-family: Georgia, "Songti SC", serif; font-size: 15px; line-height: 1.85; margin: 0 0 13px; }
    .citation { display: inline-grid; place-items: center; min-width: 21px; height: 21px; margin: 0 2px; padding: 0 5px; border: 0; border-radius: 6px; color: white; background: var(--green); font: 700 11px/1 system-ui; cursor: pointer; vertical-align: 2px; }
    .citation:hover, .citation.active { outline: 3px solid #bfe2d0; }
    .condition-row { display: flex; gap: 7px; flex-wrap: wrap; margin: 14px 0 20px; }
    .section-label { margin: 20px 0 10px; font-size: 12px; color: var(--muted); font-weight: 750; letter-spacing: .04em; }
    .user-message { max-width: 82%; margin: 0 0 22px auto; padding: 12px 15px; border-radius: 14px 14px 3px 14px; background: #193b2d; color: white; font-size: 13px; line-height: 1.6; }
    .assistant-label { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; color: var(--green); font-size: 11px; font-weight: 800; }
    .assistant-label::before { content: '证'; width: 25px; height: 25px; border-radius: 8px; display: grid; place-items: center; color: white; background: var(--green); }
    .followup { position: sticky; bottom: 0; width: 100%; display: flex; gap: 8px; border-top: 1px solid var(--line); padding: 15px 0 4px; background: white; }
    .followup input { flex: 1; height: 44px; padding: 0 13px; border: 1px solid #bdcbc4; border-radius: 11px; background: white; }
    .followup button { border: 1px solid var(--line); background: white; border-radius: 9px; padding: 0 14px; cursor: pointer; }
    .feedback { display: flex; align-items: center; gap: 7px; margin-top: 16px; color: var(--muted); font-size: 11px; }
    .feedback button { border: 1px solid var(--line); background: white; padding: 5px 8px; border-radius: 7px; cursor: pointer; }

    .filter-group { padding: 15px 0; border-bottom: 1px solid var(--line); }
    .filter-group:first-of-type { padding-top: 0; }
    .filter-label { display: flex; justify-content: space-between; font-size: 12px; font-weight: 750; margin-bottom: 10px; }
    .check { display: flex; align-items: center; gap: 8px; margin: 8px 0; font-size: 12px; color: #405047; }
    .check input { accent-color: var(--green); }
    .scope-summary { padding: 11px; background: #eef2ef; border-radius: 10px; font-size: 11px; line-height: 1.6; }
    .chat-list { display: grid; gap: 7px; margin-top: 14px; }
    .chat-item { border: 1px solid transparent; border-radius: 9px; padding: 10px; color: #506059; font-size: 11px; line-height: 1.45; cursor: pointer; }
    .chat-item.active { background: white; border-color: var(--line); color: var(--ink); box-shadow: 0 3px 10px rgba(20,43,32,.05); }

    .evidence-head { padding-bottom: 14px; border-bottom: 1px solid var(--line); }
    .evidence-head h2 { font-family: Georgia, "Songti SC", serif; font-size: 18px; margin: 9px 0 8px; line-height: 1.4; }
    .meta-grid { display: grid; grid-template-columns: 80px 1fr; gap: 7px 9px; font-size: 11px; margin-top: 13px; }
    .meta-grid dt { color: var(--muted); }
    .meta-grid dd { margin: 0; }
    .quote { margin: 18px 0; padding: 16px; border: 1px solid #d9dfd8; border-left: 4px solid var(--green); background: #fafbf8; font-family: Georgia, "Songti SC", serif; font-size: 14px; line-height: 1.8; }
    mark { background: #e6f29f; color: inherit; padding: 1px 2px; }
    .source-actions { display: flex; gap: 8px; }
    .source-actions button { flex: 1; border: 1px solid var(--line); border-radius: 8px; background: white; padding: 9px; cursor: pointer; font-size: 12px; }
    .source-stack { display: grid; gap: 9px; margin-top: 14px; }
    .source-item { border: 1px solid var(--line); background: white; border-radius: 10px; padding: 11px; cursor: pointer; }
    .source-item.active { border-color: var(--green); box-shadow: inset 3px 0 var(--green); }
    .source-item strong { font-size: 12px; display: block; line-height: 1.45; }
    .source-item span { color: var(--muted); font-size: 10px; }

    /* Variant A: three-column workbench */
    .variant-a .workspace { display: grid; grid-template-columns: 230px minmax(420px, 1fr) 390px; min-height: calc(100vh - 109px); }
    .variant-a .filters { padding: 20px 18px; border-right: 1px solid var(--line); background: #f4f6f3; }
    .variant-a .answer { padding: 30px clamp(28px, 5vw, 72px); background: white; }
    .variant-a .evidence { padding: 22px; border-left: 1px solid var(--line); background: #f8f7f2; }

    /* Variant B: document-first split */
    .variant-b .workspace { display: grid; grid-template-columns: minmax(500px, 1.2fr) minmax(420px, .8fr); min-height: calc(100vh - 109px); }
    .variant-b .document-stage { background: #dfe4df; padding: 22px 30px; border-right: 1px solid #c5cec8; }
    .pdf-toolbar { max-width: 760px; margin: 0 auto 10px; display: flex; align-items: center; justify-content: space-between; font-size: 11px; color: #48564f; }
    .pdf-page { max-width: 760px; min-height: 720px; margin: auto; padding: 54px 68px; background: white; box-shadow: var(--shadow); font-family: Georgia, "Songti SC", serif; position: relative; }
    .pdf-page::before { content: "示意原文 · 第 12 页"; position: absolute; top: 20px; right: 24px; color: #98a29c; font: 10px system-ui; }
    .pdf-page h2 { text-align: center; font-size: 20px; margin: 0 0 34px; }
    .pdf-page h3 { font-size: 15px; margin: 25px 0 11px; }
    .pdf-page p { font-size: 14px; line-height: 2; text-indent: 2em; }
    .highlight-line { background: #edf5c8; border-left: 4px solid #819d18; padding: 8px 10px; text-indent: 0 !important; }
    .variant-b .answer-side { background: white; padding: 25px 30px; overflow: auto; }
    .variant-b .compact-filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 18px; }
    .variant-b .answer h1 { font-size: 23px; }
    .source-rail { display: flex; gap: 8px; overflow-x: auto; padding: 12px 0; }
    .source-pill { min-width: 180px; border: 1px solid var(--line); border-radius: 10px; padding: 9px; background: #fafbf9; font-size: 10px; cursor: pointer; }

    /* Variant C: search-first board */
    .variant-c .workspace { max-width: 1240px; margin: 0 auto; padding: 28px; }
    .search-summary { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 18px; }
    .search-summary h1 { font-family: Georgia, "Songti SC", serif; font-size: 28px; margin: 0 0 7px; }
    .search-summary p { margin: 0; color: var(--muted); font-size: 12px; }
    .mode-tabs { display: flex; border: 1px solid var(--line); border-radius: 10px; padding: 3px; background: white; }
    .mode-tabs button { border: 0; background: transparent; border-radius: 7px; padding: 8px 12px; font-size: 12px; cursor: pointer; }
    .mode-tabs button.active { background: #173b2b; color: white; }
    .variant-c .answer-card { background: white; border: 1px solid var(--line); border-radius: 15px; padding: 26px 30px; box-shadow: 0 5px 20px rgba(23,45,35,.06); }
    .variant-c .answer-card .answer { max-width: 900px; }
    .evidence-board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 13px; margin-top: 17px; }
    .evidence-card { min-height: 230px; background: white; border: 1px solid var(--line); border-radius: 13px; padding: 16px; cursor: pointer; position: relative; }
    .evidence-card:hover { border-color: #80a692; box-shadow: 0 8px 22px rgba(25,55,41,.08); }
    .rank { position: absolute; right: 12px; top: 12px; width: 25px; height: 25px; border-radius: 50%; display: grid; place-items: center; background: var(--green-2); color: var(--green); font: 750 11px system-ui; }
    .evidence-card h3 { margin: 11px 32px 8px 0; font-family: Georgia, "Songti SC", serif; font-size: 15px; line-height: 1.45; }
    .evidence-card p { color: #49584f; font-family: Georgia, "Songti SC", serif; font-size: 12px; line-height: 1.7; }
    .card-meta { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 11px; }

    .switcher { position: fixed; z-index: 50; left: 50%; bottom: 20px; transform: translateX(-50%); display: flex; align-items: center; gap: 6px; padding: 6px; background: #10251c; color: white; border: 1px solid #476257; border-radius: 999px; box-shadow: 0 12px 30px rgba(0,0,0,.25); }
    .switcher button { width: 34px; height: 34px; border: 0; border-radius: 50%; background: #29463a; color: white; cursor: pointer; }
    .switcher button:hover { background: var(--lime); color: #183020; }
    .switcher-label { min-width: 230px; text-align: center; font-size: 12px; }
    .switcher-label strong { color: var(--lime); }
    .toast { position: fixed; right: 22px; bottom: 85px; background: #10251c; color: white; border-radius: 10px; padding: 11px 14px; font-size: 12px; box-shadow: var(--shadow); opacity: 0; transform: translateY(8px); pointer-events: none; transition: .2s ease; }
    .toast.show { opacity: 1; transform: translateY(0); }

    @media (max-width: 1050px) {
      .variant-a .workspace { grid-template-columns: 190px 1fr; }
      .variant-a .evidence { display: none; }
      .variant-b .workspace { grid-template-columns: 1fr; }
      .variant-b .document-stage { display: none; }
      .evidence-board { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 720px) {
      .topbar { height: auto; padding: 12px; flex-wrap: wrap; }
      .brand { min-width: 0; }
      .demo-tag { margin-left: auto; }
      .querybar { order: 3; min-width: 100%; }
      .scenario-strip { padding: 7px 12px; }
      .prototype-note { display: none; }
      .variant-a .workspace { display: block; }
      .variant-a .filters { display: none; }
      .variant-a .answer { padding: 24px 19px; }
      .variant-c .workspace { padding: 20px 12px; }
      .search-summary { display: block; }
      .mode-tabs { margin-top: 14px; width: max-content; }
      .evidence-board { grid-template-columns: 1fr; }
      .switcher-label { min-width: 180px; }
    }
  </style>
</head>
<body>
  <div id="app" class="app"></div>
  <div class="switcher" aria-label="原型方案切换器">
    <button id="prevVariant" aria-label="上一个方案">←</button>
    <div class="switcher-label"><strong id="variantKey">A</strong> — <span id="variantName">三栏证据工作台</span></div>
    <button id="nextVariant" aria-label="下一个方案">→</button>
  </div>
  <div id="toast" class="toast">已记录原型交互</div>

  <script>
    const variants = {
      A: { name: '连续对话 + 证据' },
      B: { name: '原文优先对照' },
      C: { name: '搜索优先证据板' }
    };

    const scenarios = {
      sufficient: {
        label: '证据充分', tone: 'green', title: '政策文件要求开展排水管网问题排查与治理',
        detail: '找到 2 条可引用依据。以下内容仅为界面原型示意，不代表真实政策结论。',
        query: '山西省关于雨污混接的政策文件要求开展哪些工作？',
        body: `示意回答：相关工作可以按“排查、整改、验收、长效管理”四个环节组织。首先建立问题台账并明确责任主体 <button class="citation" data-source="1">1</button>；随后根据问题类型制定整改计划，并保留复核记录 <button class="citation" data-source="2">2</button>。`,
        limits: ['地域：山西省', '文件状态：现行', '时间：当前', '仅展示有原文依据的要求']
      },
      clarify: {
        label: '需要补充条件', tone: 'amber', title: '“20 毫米”不足以确定降雨等级',
        detail: '降雨等级依赖统计时段和采用的标准口径，当前问题缺少决定性条件。',
        query: '雨量达到 20 毫米属于小雨、中雨还是大雨？',
        body: `我暂时不能给出唯一等级。请先确认“20 毫米”是 <strong>1 小时、6 小时、12 小时还是 24 小时</strong>累计降水量，以及希望采用哪一份标准。补充后我会分别给出对应定义和原文引用。`,
        limits: ['缺少：统计时段', '可能缺少：标准口径', '当前未形成规范结论']
      },
      empty: {
        label: '未找到依据', tone: 'red', title: '当前知识库没有可支持该结论的证据',
        detail: '没有可靠答案时切换为文档搜索结果，不使用模型记忆补齐。',
        query: '某小区出现混接，是否可以直接判定设计单位违规？',
        body: `当前知识库无法据此判断具体责任，也不提供“违规/不违规”的自动结论。你可以查看与雨污混接调查和整改相关的候选文档，或补充项目地点、建设时间和审查材料后交由专业人员复核。`,
        limits: ['越界：具体项目责任判定', '建议：查看相关规范原文', '需要人工复核']
      },
      conflict: {
        label: '来源存在差异', tone: 'blue', title: '两份文件的适用地域和对象不同',
        detail: '分别展示证据，不把不同文件自动合并为一条通用规则。',
        query: '国家标准和地方导则对雨污混接改造的要求有什么不同？',
        body: `文档 A 给出通用工程要求 <button class="citation" data-source="1">1</button>，文档 B 针对特定地域和改造对象补充了工作要求 <button class="citation" data-source="2">2</button>。由于两者适用范围不同，当前不宜直接判断为“规定冲突”。`,
        limits: ['比较对象：2 份文件', '差异：地域与适用对象', '不自动作适用性裁决']
      }
    };

    const sources = {
      1: { title: '山西省排水相关政策文件（示意）', type: '政府政策', issuer: '发布机关示意', code: '文号待核验', region: '山西省', status: '现行状态待核验', date: '发布日期待核验', clause: '第二部分 · 工作要求', page: 'PDF 第 12 页', quote: '本段为界面布局使用的示意原文，不代表任何真实政策条款。正式产品中此处展示与答案主张直接对应的原文，并高亮支持性语句。' },
      2: { title: '城镇排水管网治理工作方案（示意）', type: '工作方案', issuer: '发布机关示意', code: '文号待核验', region: '示意地域', status: '状态待核验', date: '日期待核验', clause: '第三章 · 整改与复核', page: 'PDF 第 18 页', quote: '本段为第二条证据的原文示意。真实系统需要保留条款上下文、适用对象、时间要求及相关注释，不能只抽取一句话。' },
      3: { title: '降水量等级标准（示意来源）', type: '国家标准', issuer: '发布机关待核验', code: '标准号待核验', region: '全国', status: '待核验', date: '日期待核验', clause: '降水量等级定义', page: 'PDF 页码待核验', quote: '此处不展示虚构的降雨等级数值。真实查询必须先确认统计时段，再从已登记标准中提取对应等级定义。' }
    };

    let currentSource = 1;
    const params = new URLSearchParams(location.search);
    let variant = (params.get('variant') || 'A').toUpperCase();
    let scenario = params.get('state') || 'sufficient';
    if (!variants[variant]) variant = 'A';
    if (!scenarios[scenario]) scenario = 'sufficient';

    function shell(content) {
      return `
        <header class="topbar">
          <div class="brand"><div class="brand-mark">证</div><div><strong>排水规范证据助手</strong><small>Evidence-first workspace</small></div></div>
          <div class="session-context"><strong>当前会话：降雨等级与雨污混接政策核验</strong><span>公开规范语料 · POC-2026.09.03 · 当前范围：山西省优先</span></div>
          <span class="demo-tag">交互原型 · 非真实数据</span>
        </header>
        <nav class="scenario-strip"><span>演示状态</span>${Object.entries(scenarios).map(([key, value]) => `<button class="scenario ${key === scenario ? 'active' : ''}" data-scenario="${key}">${value.label}</button>`).join('')}<span class="prototype-note">← 点击切换结果状态</span></nav>
        ${content}`;
    }

    function statusBox() {
      const s = scenarios[scenario];
      return `<div class="status-box ${s.tone === 'green' ? '' : s.tone}"><strong>${s.label} · ${s.title}</strong><span>${s.detail}</span></div>`;
    }

    function answerContent(compact = false) {
      const s = scenarios[scenario];
      return `<div class="answer"><div class="user-message">${s.query}</div><div class="assistant-label">规范证据助手</div><p class="eyebrow">回答 · 依据当前知识库</p><h1>${s.title}</h1>${statusBox()}<p>${s.body}</p><div class="section-label">本轮继承的条件</div><div class="condition-row">${s.limits.map(x => `<span class="chip ${s.tone}">${x}</span>`).join('')}</div>${compact ? '' : `<div class="feedback"><span>这次结果：</span><button data-action="feedback">回答有帮助</button><button data-action="feedback">引用不支持</button><button data-action="feedback">漏掉相关文件</button></div><div class="followup"><input placeholder="继续追问，或补充统计时段、地域、文件范围…"><button class="primary" data-action="followup">发送</button></div>`}</div>`;
    }

    function filters() {
      return `<aside class="filters"><div class="pane-title"><h2>对话</h2><button class="icon-btn" title="新对话">＋</button></div><div class="section-label">最近对话</div><div class="chat-list"><div class="chat-item active">雨污混接政策要求<br><span class="muted">刚刚</span></div><div class="chat-item">20 毫米降雨等级<br><span class="muted">今天</span></div><div class="chat-item">入流入渗监测依据<br><span class="muted">昨天</span></div></div><div class="filter-group"><p class="tiny muted">地域、时间和文件层级由系统从问题中识别。地方文件与国家文件会在回答和证据中分别标明；条件不清楚时通过对话追问。</p></div></aside>`;
    }

    function evidenceDetail(id = currentSource) {
      const d = sources[id] || sources[1];
      return `<div class="evidence-head"><div class="pane-title"><h3>原文证据</h3><span class="chip green">引用 ${id}</span></div><span class="chip">${d.type}</span><h2>${d.title}</h2><dl class="meta-grid"><dt>发布机关</dt><dd>${d.issuer}</dd><dt>文号/标准号</dt><dd>${d.code}</dd><dt>地域</dt><dd>${d.region}</dd><dt>效力状态</dt><dd>${d.status}</dd><dt>发布日期</dt><dd>${d.date}</dd><dt>定位</dt><dd>${d.clause} · ${d.page}</dd></dl></div><blockquote class="quote"><mark>${d.quote}</mark></blockquote><div class="source-actions"><button data-action="open">在 PDF 中打开</button><button data-action="copy">复制引用</button></div>`;
    }

    function sourceList() {
      return `<div class="section-label">本次使用的证据</div><div class="source-stack">${[1,2,3].map(id => `<div class="source-item ${id === currentSource ? 'active' : ''}" data-source-card="${id}"><strong>[${id}] ${sources[id].title}</strong><span>${sources[id].type} · ${sources[id].region} · ${sources[id].page}</span></div>`).join('')}</div>`;
    }

    function variantA() {
      return shell(`<main class="variant-a"><div class="workspace">${filters()}<section class="answer">${answerContent().replace('<div class="answer">','').replace(/<\/div>$/,'')}</section><aside class="evidence" id="evidencePanel">${evidenceDetail()}${sourceList()}</aside></div></main>`);
    }

    function variantB() {
      const d = sources[currentSource];
      return shell(`<main class="variant-b"><div class="workspace"><section class="document-stage"><div class="pdf-toolbar"><span>← 返回来源列表</span><strong>${d.title}</strong><span>${d.page} · 125%</span></div><article class="pdf-page"><h2>${d.title}</h2><h3>${d.clause}</h3><p>这里模拟完整 PDF 页面，而不是只显示脱离上下文的文本片段。用户可以先理解章节位置，再核对被引用内容。</p><p class="highlight-line">${d.quote}</p><p>原文前后内容继续显示在页面中，用于判断引用是否断章取义。发布机关、文号、版本和效力状态固定显示在问答侧栏。</p></article></section><aside class="answer-side"><div class="compact-filters"><span class="chip">地域：山西省</span><span class="chip">现行优先</span><span class="chip">政策 + 标准</span></div>${answerContent()}<div class="section-label">切换原文</div><div class="source-rail">${[1,2,3].map(id => `<div class="source-pill" data-source-card="${id}"><strong>[${id}] ${sources[id].title}</strong><br><span class="muted">${sources[id].page}</span></div>`).join('')}</div></aside></div></main>`);
    }

    function variantC() {
      const s = scenarios[scenario];
      return shell(`<main class="variant-c"><div class="workspace"><div class="search-summary"><div><p class="eyebrow">检索结果 · 8 个受控文档版本</p><h1>${s.title}</h1><p>先看证据，再决定是否采用综合回答。</p></div><div class="mode-tabs"><button class="active">证据化回答</button><button data-action="mode">只看搜索结果</button></div></div><section class="answer-card">${answerContent(true)}</section><div class="evidence-board">${[1,2,3].map(id => { const d=sources[id]; return `<article class="evidence-card" data-source-card="${id}"><span class="rank">${id}</span><span class="chip">${d.type}</span><h3>${d.title}</h3><p>${d.quote}</p><div class="card-meta"><span class="chip green">${d.region}</span><span class="chip">${d.page}</span></div></article>`; }).join('')}</div></div></main>`);
    }

    function render() {
      document.getElementById('app').innerHTML = variant === 'A' ? variantA() : variant === 'B' ? variantB() : variantC();
      document.getElementById('variantKey').textContent = variant;
      document.getElementById('variantName').textContent = variants[variant].name;
      bind();
    }

    function setUrl() {
      const next = new URL(location.href);
      next.searchParams.set('variant', variant);
      next.searchParams.set('state', scenario);
      history.replaceState({}, '', next);
    }

    function cycle(direction) {
      const keys = Object.keys(variants);
      variant = keys[(keys.indexOf(variant) + direction + keys.length) % keys.length];
      setUrl(); render();
    }

    function showToast(text) {
      const el = document.getElementById('toast');
      el.textContent = text; el.classList.add('show');
      clearTimeout(showToast.timer); showToast.timer = setTimeout(() => el.classList.remove('show'), 1700);
    }

    function bind() {
      document.querySelectorAll('[data-scenario]').forEach(btn => btn.addEventListener('click', () => {
        scenario = btn.dataset.scenario; currentSource = scenario === 'clarify' ? 3 : 1; setUrl(); render();
      }));
      document.querySelectorAll('.citation').forEach(btn => btn.addEventListener('click', () => {
        currentSource = Number(btn.dataset.source); render(); showToast(`已定位引用 ${currentSource} 的原文证据`);
      }));
      document.querySelectorAll('[data-source-card]').forEach(card => card.addEventListener('click', () => {
        currentSource = Number(card.dataset.sourceCard); render(); showToast(`已打开来源 ${currentSource}`);
      }));
      document.querySelectorAll('[data-action]').forEach(btn => btn.addEventListener('click', () => {
        const action = btn.dataset.action;
        const messages = { search:'原型：已模拟重新检索', followup:'原型：已发送追问，并继承当前地域与文件范围', feedback:'已记录结构化反馈示意', open:'原型：这里将打开并定位 PDF', copy:'原型：已复制标准引用格式', mode:'原型：这里将切换为纯搜索结果' };
        showToast(messages[action] || '已触发原型交互');
      }));
    }

    document.getElementById('prevVariant').addEventListener('click', () => cycle(-1));
    document.getElementById('nextVariant').addEventListener('click', () => cycle(1));
    document.addEventListener('keydown', event => {
      const tag = document.activeElement?.tagName;
      if (['INPUT','TEXTAREA'].includes(tag) || document.activeElement?.isContentEditable) return;
      if (event.key === 'ArrowLeft') cycle(-1);
      if (event.key === 'ArrowRight') cycle(1);
    });
    render();
  </script>
</body>
</html>
