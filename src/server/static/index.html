<body>
  <div id="app" class="app mode-a">
    <header class="topbar">
      <div class="brand"><div class="mark">法</div><div><strong>法规文档 RAG 智能问答系统</strong><small>Regulatory RAG · 排水领域</small></div></div>
      <div class="corpus"><span id="runtimeProfile"></span></div>
      <a href="/documents" style="color:#c8ee66;text-decoration:none;font-size:12px">资料浏览</a>
    </header>
    <main class="workspace">
      <aside class="left"><div class="pane-head"><h2>对话记录</h2><button id="newChat" class="new">＋ 新对话</button></div><nav id="history" class="history" aria-label="历史对话"></nav><p class="note">对话记录只保存在当前浏览器中，清除浏览器数据或换设备后不会保留。</p></aside>
      <div class="splitter" data-split="left" role="separator" aria-orientation="vertical" title="拖动调整宽度，双击还原"></div>
      <section class="chat"><div id="messages" class="messages"></div><div class="composer"><form id="queryForm" aria-label="提交问题"><input id="question" autocomplete="off" placeholder="输入规范、政策或监测问题…"><button id="send" class="send" type="submit">发送</button></form></div></section>
      <div class="splitter" data-split="right" role="separator" aria-orientation="vertical" title="拖动调整宽度，双击还原"></div>
      <aside id="evidence" class="evidence" aria-label="原文来源"><div class="pane-head"><h2>原文来源</h2><span id="evidenceCount" class="chip">0 条</span><button id="closeSources" class="drawer-close" type="button">关闭</button></div><div id="evidencePanel"></div></aside>
    </main>
    <button id="sourceToggle" class="source-toggle" type="button">查看来源 · 0</button>
    <button id="drawerBackdrop" class="drawer-backdrop" type="button" aria-label="关闭来源面板"></button>
  </div>
  <script>
const state = {
  context: {}, turns: [], evidence: [], referenceIds: [], citedDocs: [], selectedId: null,
  busy: false, reader: null, conversationId: null,
  geometryCache: new Map(), documentCache: new Map(), readerObserver: null,
};
const $ = selector => document.querySelector(selector);

// Conversations live only in this browser; the server keeps no history.
const HISTORY_KEY = 'rag.conversations.v1';
const HISTORY_LIMIT = 30;
function loadConversations() {
  try {
    const saved = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
    return Array.isArray(saved) ? saved.filter(item => item && item.id && Array.isArray(item.turns)) : [];
  } catch { return []; }
}
function storeConversations(list) {
  // Evidence makes entries large; drop the oldest until the browser accepts it.
  for (let keep = Math.min(list.length, HISTORY_LIMIT); keep >= 0; keep -= 1) {
    try { localStorage.setItem(HISTORY_KEY, JSON.stringify(list.slice(0, keep))); return; }
    catch { /* quota exceeded or storage blocked */ }
  }
}
function saveConversation() {
  const turns = state.turns.filter(turn => !turn.loading)
    .map(turn => ({question: turn.question, result: turn.result}));
  if (!turns.length) return;
  if (!state.conversationId) state.conversationId = `c${Date.now().toString(36)}${Math.random().toString(36).slice(2, 6)}`;
  const entry = {id: state.conversationId, title: turns[0].question, updatedAt: Date.now(),
    context: state.context, turns};
  const list = [entry, ...loadConversations().filter(item => item.id !== entry.id)];
  storeConversations(list);
  renderHistory();
}
function relativeTime(time) {
  const minutes = Math.round((Date.now() - time) / 60000);
  if (minutes < 1) return '刚刚';
  if (minutes < 60) return `${minutes} 分钟前`;
  const hours = Math.round(minutes / 60);
  if (hours < 24) return `${hours} 小时前`;
  const date = new Date(time);
  return `${date.getMonth() + 1}月${date.getDate()}日`;
}
function renderHistory() {

function openConversation(id) {

const node = (tag, className, content) => {

};
const statusText = {
  answered: '已基于证据回答', search_only: '请查看原文', conflicting_sources: '来源存在冲突',
  refused: '当前证据不足',

function citedIds(result) {
  const available = new Set((result.evidence || []).map(item => item.evidence_id));
  const seen = new Set();
  const ordered = [];
  for (const claim of result.answer?.claims || []) {
    for (const id of claim.evidence_ids || []) {
      if (available.has(id) && !seen.has(id)) {
        seen.add(id);
        ordered.push(id);
      }
    }
  }
  return ordered;
}
function docKey(evidence) {
  return evidence.document_version_id || evidence.file_name || evidence.evidence_id;
}
// Citations are numbered per document, in order of first appearance.
function groupByDocument(items) {
  const groups = new Map();
  for (const item of items) {
    const key = docKey(item);
    if (!groups.has(key)) groups.set(key, {key, fileName: item.file_name || '未命名文档', items: []});
    groups.get(key).items.push(item);
  }
  return [...groups.values()];
}
function citedDocuments(result) {
  const byId = new Map((result.evidence || []).map(item => [item.evidence_id, item]));
  return groupByDocument(citedIds(result).map(id => byId.get(id)));
}

function openSource(turn, evidenceId) {
  if (!turn.result) return;

  state.selectedId = evidenceId;
  // A citation opens straight into the whole document at the cited passage.
  const evidence = state.evidence.find(item => item.evidence_id === evidenceId);
  const page = evidence && citedPage(evidence);

  if (state.reader) closeReader();
  openDrawer();
  requestAnimationFrame(() => {

// Formula transcriptions arrive as LaTeX-style subscripts (KQ_{g}); show
// them as real subscripts without interpreting any other markup.
function withSubscripts(parent, text) {
  const pattern = /_\{([^{}]{1,12})\}|_([A-Za-z0-9])(?![A-Za-z0-9])/g;
  let last = 0;
  for (const match of text.matchAll(pattern)) {
    parent.append(text.slice(last, match.index), node('sub', '', match[1] ?? match[2]));
    last = match.index + match[0].length;
  }
  parent.append(text.slice(last));
  return parent;
}

// The model marks headings as **bold**; render that and drop stray markers.
function claimText(text) {
  const span = node('span', 'claim-text');
  let last = 0;
  for (const match of text.matchAll(/\*\*([^*\n]+?)\*\*/g)) {
    withSubscripts(span, text.slice(last, match.index).replaceAll('**', ''));
    span.append(withSubscripts(node('strong', ''), match[1]));
    last = match.index + match[0].length;
  }
  withSubscripts(span, text.slice(last).replaceAll('**', ''));
  return span;
}

function renderTurn(turn) {
  const wrap = node('article', 'turn');
  wrap.append(node('div', 'user', turn.question));
  wrap.append(node('div', 'assistant-head', '法规文档 RAG 智能问答系统'));
  if (turn.loading) {
    wrap.append(node('div', 'loading', '正在检索并核验证据…'));
    return wrap;
  }
  const result = turn.result;
  const status = node('div', `status ${result.status}`);
  status.append(node('strong', '', statusText[result.status] || result.status));
  const detail = {
    refused: '当前语料不能直接支持这个问题，系统没有拼凑答案。',
    search_only: '已找到相关原文，请查看来源面板中的文档与页码。',
    conflicting_sources: '分别展示各来源，不替你裁决。',
  }[result.status];
  if (detail) status.append(node('div', '', detail));
  // A follow-up searched as a rewritten question says what was searched.
  if (result.search_question && result.search_question !== turn.question)
    wrap.append(node('p', 'search-note', `检索：${result.search_question}`));
  // A normal answer needs no banner; its markers already point to the source.
  if (result.status !== 'answered') wrap.append(status);

  // One number per document; each marker still opens the passage this
  // particular claim relies on.
  const docs = citedDocuments(result);
  const numberByDoc = new Map(docs.map((group, index) => [group.key, index + 1]));
  const byId = new Map((result.evidence || []).map(item => [item.evidence_id, item]));
  // Claims read as one continuous answer, each followed by its markers.
  const paragraph = node('p', 'claim');
  const claims = result.answer?.claims || [];
  const citesOf = claim => {
    const firstByNumber = new Map();
    for (const id of claim.evidence_ids || []) {
      const number = byId.has(id) && numberByDoc.get(docKey(byId.get(id)));
      if (number && !firstByNumber.has(number)) firstByNumber.set(number, id);
    }
    return [...firstByNumber].sort((a, b) => a[0] - b[0]);
  };
  claims.forEach((claim, index) => {
    paragraph.append(claimText(claim.text));
    const cites = citesOf(claim);
    // A run of sentences from the same source carries one marker, at the
    // end of the run; a new paragraph always shows its own.
    const next = claims[index + 1];
    if (next && !/^\s*\n\s*\n/.test(next.text) &&
        citesOf(next).map(([number]) => number).join() === cites.map(([number]) => number).join()) return;
    for (const [number, id] of cites) {
      const cite = node('button', 'cite', `[${number}]`);
      cite.type = 'button';
      cite.title = `查看来源 ${number} · ${docs[number - 1].fileName}`;
      cite.setAttribute('aria-label', `查看来源 ${number}`);
      cite.addEventListener('click', () => openSource(turn, id));
      paragraph.append(cite);
    }
  });
  if (paragraph.childNodes.length) wrap.append(paragraph);
  if (result.answer?.claims?.some(claim => claim.verified === false)) {
    wrap.append(node('p', 'warning', '部分引用来自机器识别，请对照原文页。'));
  }
  const warnings = (result.warnings || []).filter(message =>
    !(result.answer?.claims?.some(claim => claim.verified === false) &&
      message.includes('未经人工核对')));
  if (warnings.length) wrap.append(node('p', 'warning', warnings.join('；')));
  return wrap;
}

function renderMessages() {
  const root = $('#messages');
  if (!state.turns.length) { renderEmpty(); return; }
  root.replaceChildren(...state.turns.map(renderTurn));
  root.scrollTop = root.scrollHeight;

function pageImageUrl(documentId, page) {
  return `/api/v1/documents/${encodeURIComponent(documentId)}/pages/${page}/image`;
}
function pageMetadataUrl(documentId, page) {
  return `/api/v1/documents/${encodeURIComponent(documentId)}/pages/${page}`;
}
function pageGeometry(documentId, page) {
  const key = `${documentId}:${page}`;
  if (!state.geometryCache.has(key)) {
    const request = fetch(pageMetadataUrl(documentId, page))
      .then(response => {
        if (!response.ok) throw new Error(`Page geometry HTTP ${response.status}`);
        return response.json();
      });
    state.geometryCache.set(key, request);
  }
  return state.geometryCache.get(key);
}
function documentMetadata(documentId) {
  if (!state.documentCache.has(documentId)) {
    const request = fetch(`/api/v1/documents/${encodeURIComponent(documentId)}`)
      .then(response => {
        if (!response.ok) throw new Error(`Document HTTP ${response.status}`);
        return response.json();
      });
    state.documentCache.set(documentId, request);
  }
  return state.documentCache.get(documentId);
}

function regionsOnPage(evidence, page) {
  return (evidence.source_regions || []).filter(region =>
    Number(region.physical_page) === page && Array.isArray(region.bbox) &&
    region.bbox.length === 4 && region.bbox.every(Number.isFinite));
}
function addPageHighlights(canvas, regions, geometry) {
  if (!geometry || !(geometry.page_width_pt > 0) || !(geometry.page_height_pt > 0)) return;
  canvas.querySelectorAll('.page-highlight').forEach(box => box.remove());
  for (const region of regions) {
    const [x0, y0, x1, y1] = region.bbox;
    if (x0 < 0 || y0 < 0 || x1 <= x0 || y1 <= y0 ||
        x1 > geometry.page_width_pt || y1 > geometry.page_height_pt) continue;
    const box = node('div', 'page-highlight');
    box.dataset.clause = region.clause;
    box.classList.toggle('other', region.clause !== state.reader?.focusClause);
    box.style.left = `${100 * x0 / geometry.page_width_pt}%`;
    box.style.top = `${100 * y0 / geometry.page_height_pt}%`;
    box.style.width = `${100 * (x1 - x0) / geometry.page_width_pt}%`;
    box.style.height = `${100 * (y1 - y0) / geometry.page_height_pt}%`;
    box.title = `第 ${region.physical_page} 页原文区域`;
    canvas.append(box);
  }
}
// Every passage this answer cites from the document is highlighted; the one
// the reader came for is drawn stronger.
function readerRegions(page) {
  return (state.reader?.items || []).flatMap(item =>
    regionsOnPage(item, page).map(region => ({...region, clause: clauseKey(item)})));
}
function pageFigure(documentId, fileName, page, lazy = true) {
  const frame = node('div', 'page-preview');
  const canvas = node('div', 'page-canvas');
  const image = node('img', '');
  image.alt = `${fileName} 第 ${page} 页原文`;
  image.loading = lazy ? 'lazy' : 'eager';
  image.addEventListener('load', async () => {
    try {
      const geometry = await pageGeometry(documentId, page);
      addPageHighlights(canvas, readerRegions(page), geometry);
      if (state.reader && !state.reader.centered && page === state.reader.targetPage) {
        state.reader.centered = true;
        centerHighlight();
      }
    } catch (error) { console.warn('无法取得页面尺寸', error); }
  });
  image.src = pageImageUrl(documentId, page);
  canvas.append(image);
  frame.append(canvas);
  return frame;
}

function locationLabel(evidence) {
  const heading = (evidence.heading_path || []).at(-1) || '';
  const short = heading.length > 18 ? `${heading.slice(0, 18)}…` : heading;
  return [short, `第 ${citedPage(evidence) || '?'} 页`].filter(Boolean).join(' · ');
}

// The chunker splits one clause into several pieces (lead-in, formula,
// variable lines); readers think in clauses, so they are shown as one.
function clauseKey(evidence) {
  return `${docKey(evidence)}|${citedPage(evidence)}|${(evidence.heading_path || []).join('›')}`;
}
function groupByClause(items) {
  const groups = new Map();
  for (const item of items) {
    const key = clauseKey(item);
    if (!groups.has(key)) groups.set(key, {key, items: []});
    groups.get(key).items.push(item);
  }
  return [...groups.values()];
}

// One line per cited clause; its cropped original and recognised text stay
// folded until asked for, and the line itself opens the full document.
function sourceLocation(clause) {
  const [first] = clause.items;
  const block = node('details', 'source-location');
  block.dataset.clause = clause.key;
  const head = node('summary', 'location-head');
  const pages = [...new Set(clause.items.flatMap(item => item.physical_pages || []))].sort((x, y) => x - y);
  head.append(node('span', 'location-label', `第 ${pages.join('、') || '?'} 页 · ${(first.heading_path || []).join(' › ') || '位置待补充'}`));
  if (clause.items.some(item => item.usage_policy === 'source_locator_only'))
    head.append(node('span', 'machine-tag', '含机器识别'));
  const page = citedPage(first);
  if (first.document_version_id && Number.isInteger(page) && page > 0) {
    const read = node('button', 'read-button', '原文 ›');
    read.type = 'button';
    read.title = '在全文中查看';
    read.addEventListener('click', event => { event.preventDefault(); openReader(first); });
    head.append(read);
  }
  block.append(head);
  const excerpt = node('p', 'source-excerpt full', clause.items.map(item => item.text).filter(Boolean).join('\n') || '无文本摘录');
  const seen = new Set();
  const regions = clause.items.flatMap(item => item.source_regions || [])
    .filter(region => region.region_id && !seen.has(region.region_id) && seen.add(region.region_id))
    .slice(0, 6);
  if (!regions.length) { block.append(excerpt); return block; }
  // Crops load only when the clause is first unfolded.
  block.addEventListener('toggle', () => {
    if (!block.open || block.dataset.loaded) return;
    block.dataset.loaded = 'true';
    const crops = node('div', 'region-crops');
    for (const region of regions) {
      const image = node('img', 'region-crop');
      image.alt = `${first.file_name} 第 ${region.physical_page} 页引用原文`;
      image.addEventListener('error', () => {
        image.remove();
        if (!crops.querySelector('img')) crops.replaceWith(excerpt);
      });
      image.src = `/api/v1/regions/${encodeURIComponent(region.region_id)}/image`;
      crops.append(image);
    }
    const text = node('details', 'recognised-text');
    text.append(node('summary', '', '识别文本'), excerpt);
    block.append(crops, text);
  });
  return block;
}

function pageList(items) {
  const pages = [...new Set(items.flatMap(item => item.physical_pages || []))].sort((a, b) => a - b);
  return pages.length ? `第 ${pages.join('、')} 页` : '页码待补充';
}

// One card per document; the passages used from it are listed inside.
function documentCard(group, number, cited) {
  const card = node('article', 'source-card');
  card.dataset.documentKey = group.key;
  const heading = node('div', 'source-card-head');
  if (number) heading.append(node('span', 'source-number', `[${number}]`));
  const clauses = groupByClause(group.items);
  const copy = node('div', 'source-card-copy');
  copy.append(
    node('strong', '', group.fileName),
    node('small', '', cited ? `本回答引用 ${clauses.length} 处` : `${pageList(group.items)} · ${clauses.length} 处`),
  );
  heading.append(copy);
  card.append(heading, ...clauses.map(sourceLocation));
  return card;
}

function citedPage(evidence) {
  return Number((evidence.source_regions || []).find(region =>
    Array.isArray(region.bbox) && region.bbox.length === 4 &&
    Number.isInteger(Number(region.physical_page)))?.physical_page ||
    evidence.physical_pages?.[0]);
}

function stopReaderObserver() {
  if (state.readerObserver) state.readerObserver.disconnect();
  if (state.readerResize) state.readerResize.disconnect();
  state.readerResize = null;
  state.readerObserver = null;
}
function renderSourceList() {
  const root = $('#evidencePanel');
  if (!state.evidence.length) {
    root.replaceChildren(node('div', 'evidence-empty', '提交问题后，这里展示原文、文档名称、位置和页码。'));
    return;
  }
  const list = node('div', 'source-list');
  if (state.citedDocs.length) {
    state.citedDocs.forEach((group, index) => list.append(documentCard(group, index + 1, true)));
    const others = state.evidence.filter(item => !state.referenceIds.includes(item.evidence_id));
    if (others.length) {
      const folded = node('details', 'other-results');
      folded.append(node('summary', '', `其他检索结果（${groupByDocument(others).length} 份文件）`));
      // Uncited hits collapse to one row per document.
      for (const group of groupByDocument(others)) {
        const clauses = groupByClause(group.items);
        const row = node('details', 'other-doc');
        const summary = node('summary', '');
        summary.append(node('strong', '', group.fileName), node('small', '', `${pageList(group.items)} · ${clauses.length} 处`));
        row.append(summary, ...clauses.map(sourceLocation));
        folded.append(row);
      }
      list.append(folded);
    }
  } else {
    groupByDocument(state.evidence).forEach(group =>
      list.append(documentCard(group, null, false)));
  }
  root.replaceChildren(list);
}

async function openReader(evidence) {
  const page = citedPage(evidence);
  if (!evidence.document_version_id || !Number.isInteger(page) || page < 1) return;
  const key = docKey(evidence);
  if (state.reader?.docKey === key &&
      state.reader.items.some(item => clauseKey(item) === clauseKey(evidence))) {
    focusLocation(clauseKey(evidence));
    openDrawer();
    return;
  }
  try {
    const document = await documentMetadata(evidence.document_version_id);
    if (!Number.isInteger(document.page_count) || document.page_count < 1) throw new Error('原文页数不可用');
    const cited = state.citedDocs.find(group => group.key === key)?.items || [];
    const items = cited.includes(evidence) ? cited : [...cited, evidence];
    const zoom = state.reader?.zoom || 100;
    state.selectedId = evidence.evidence_id;
    state.reader = {docKey: key, items, focusClause: clauseKey(evidence), document,
      targetPage: page, zoom, centered: false};
    $('.workspace').classList.add('reading');
    renderEvidence();
    openDrawer();
  } catch (error) {
    console.warn('无法打开全文', error);
    $('#evidencePanel').prepend(node('p', 'warning', '全文暂不可用，请稍后重试。'));
  }
}

function closeReader() {
  state.reader = null;
  $('.workspace').classList.remove('reading');
  $('#evidence').classList.remove('fullscreen');
  renderEvidence();
}

function centerHighlight(flash = true) {
  const section = document.querySelector(`.reader-page[data-page="${state.reader?.targetPage}"]`);
  if (!section) return;
  const boxes = [...section.querySelectorAll('.page-highlight')]
    .filter(box => box.dataset.clause === state.reader.focusClause);
  (boxes[0] || section).scrollIntoView({block: boxes.length ? 'center' : 'start'});
  // Pages above load after this and change height; stay on the passage
  // until the reader scrolls on their own.
  state.reader.pinned = true;
  if (!flash) return;
  boxes.forEach(box => {
    box.classList.remove('flash');
    void box.offsetWidth;
    box.classList.add('flash');
  });
}

// Moving between passages of the open document only re-targets the view.
function focusLocation(clause) {
  const reader = state.reader;
  const item = reader.items.find(entry => clauseKey(entry) === clause);
  if (!item) return;
  reader.focusClause = clause;
  reader.targetPage = citedPage(item);
  state.selectedId = item.evidence_id;
  document.querySelectorAll('.reader-pages .page-highlight').forEach(box =>
    box.classList.toggle('other', box.dataset.clause !== clause));
  renderReaderCaption();
  const section = document.querySelector(`.reader-page[data-page="${reader.targetPage}"]`);
  if (!section) return;
  reader.load(section);
  if (section.querySelector('.page-highlight')) {
    reader.centered = true;
    centerHighlight();
  } else {
    reader.centered = false;
    section.scrollIntoView({block: 'start'});
  }
}

function renderReaderCaption() {
  const reader = state.reader;
  const caption = reader.caption;
  caption.replaceChildren();
  if (state.citedDocs.length > 1) {
    const switcher = node('div', 'reader-switch');
    state.citedDocs.forEach((group, index) => {
      const button = node('button', group.key === reader.docKey ? 'active' : '', `[${index + 1}]`);
      button.type = 'button';
      button.title = group.fileName;
      button.addEventListener('click', () => openReader(group.items[0]));
      switcher.append(button);
    });
    caption.append(switcher);
  }
  const number = state.citedDocs.findIndex(group => group.key === reader.docKey) + 1;
  const citedCount = groupByClause(reader.items.filter(item => state.referenceIds.includes(item.evidence_id))).length;
  caption.append(node('span', '', citedCount
    ? `${number ? `[${number}] ` : ''}本回答引用此文件 ${citedCount} 处：`
    : '检索结果位置：'));
  const locations = node('div', 'reader-locations');
  for (const {key, items: [item]} of groupByClause(reader.items)) {
    const button = node('button', key === reader.focusClause ? 'active' : '', locationLabel(item));
    button.type = 'button';
    button.title = (item.heading_path || []).join(' › ');
    button.addEventListener('click', () => focusLocation(key));
    locations.append(button);
  }
  caption.append(locations);
}

function renderReader() {
  const reader = state.reader;
  const {document} = reader;
  const fileName = reader.items[0]?.file_name || document.file_name;
  const root = $('#evidencePanel');
  const toolbar = node('div', 'reader-toolbar');
  const back = node('button', '', '← 来源列表');
  back.type = 'button';
  back.addEventListener('click', closeReader);
  const zoomOut = node('button', '', '−');
  const zoomLabel = node('span', 'zoom-label', `${reader.zoom}%`);
  const zoomIn = node('button', '', '+');
  zoomOut.title = '缩小';
  zoomIn.title = '放大';
  const fullscreen = node('button', '', $('#evidence').classList.contains('fullscreen') ? '退出全屏' : '全屏');
  fullscreen.addEventListener('click', () => {
    $('#evidence').classList.toggle('fullscreen');
    fullscreen.textContent = $('#evidence').classList.contains('fullscreen') ? '退出全屏' : '全屏';
  });
  toolbar.append(back, node('strong', '', fileName), zoomOut, zoomLabel, zoomIn, fullscreen);

  reader.caption = node('div', 'reader-caption');
  renderReaderCaption();

  const pages = node('div', 'reader-pages');
  pages.style.width = `${reader.zoom}%`;
  for (let page = 1; page <= document.page_count; page++) {
    const section = node('section', 'reader-page');
    section.dataset.page = String(page);
    section.append(node('h4', '', `第 ${page} / ${document.page_count} 页`));
    const placeholder = node('div', 'page-preview page-placeholder');
    placeholder.textContent = '页面加载中…';
    section.append(placeholder);
    pages.append(section);
  }
  const setZoom = value => {
    reader.zoom = Math.min(250, Math.max(100, value));
    pages.style.width = `${reader.zoom}%`;
    zoomLabel.textContent = `${reader.zoom}%`;
    requestAnimationFrame(centerHighlight);
  };
  zoomOut.addEventListener('click', () => setZoom(reader.zoom - 50));
  zoomIn.addEventListener('click', () => setZoom(reader.zoom + 50));
  const head = node('div', 'reader-head');
  head.append(toolbar, reader.caption);
  const scroller = node('div', 'reader-scroll');
  scroller.append(pages);
  root.replaceChildren(head, scroller);
  stopReaderObserver();
  reader.load = section => {
    if (section.dataset.loaded) return;
    section.dataset.loaded = 'true';
    const page = Number(section.dataset.page);
    section.lastElementChild.replaceWith(
      pageFigure(reader.items[0].document_version_id,
        fileName, page, page !== reader.targetPage));
  };
  // Placeholders guess an A4 height; when real pages above the target load,
  // keep the cited passage where the reader was sent.
  let settle = 0;
  state.readerResize = new ResizeObserver(() => {
    if (!reader.pinned || !reader.centered) return;
    cancelAnimationFrame(settle);
    settle = requestAnimationFrame(() => centerHighlight(false));
  });
  state.readerResize.observe(pages);
  const release = () => { reader.pinned = false; };
  for (const type of ['wheel', 'touchstart', 'pointerdown', 'keydown'])
    scroller.addEventListener(type, release, {passive: true});
  state.readerObserver = new IntersectionObserver(entries => {
    entries.forEach(entry => { if (entry.isIntersecting) reader.load(entry.target); });
  }, {root: scroller, rootMargin: '700px 0px'});
  pages.querySelectorAll('.reader-page').forEach(section => state.readerObserver.observe(section));
  const target = pages.querySelector(`[data-page="${reader.targetPage}"]`);
  if (target) {
    reader.load(target);
    requestAnimationFrame(() => target.scrollIntoView({block: 'start'}));
  }
}

function renderEvidence() {
  const cited = state.citedDocs.length;
  const total = groupByDocument(state.evidence).length;
  $('#evidenceCount').textContent = cited ? `引用 ${cited} 份文件` : `${total} 份文件`;
  $('#sourceToggle').textContent = `查看来源 · ${cited || total}`;
  if (state.reader) renderReader();
  else { stopReaderObserver(); renderSourceList(); }
}

async function responseError(response) {
  try {
    const payload = await response.json();
    const error = new Error(payload.error?.message || `HTTP ${response.status}`);
    error.code = payload.error?.code || 'http_error';
    return error;
  } catch { return new Error(`HTTP ${response.status}`); }
}

// The last few turns go with a follow-up so the server can resolve what it
// refers to; answers are sent as the plain text the user saw.
function recentHistory(limit = 3) {
  return state.turns.filter(turn => !turn.loading && turn.result).slice(-limit).map(turn => ({
    question: turn.question,
    answer: (turn.result.answer?.claims || []).map(claim => claim.text).join('').trim().slice(0, 6000),
  }));
}

async function submit(raw) {
  const question = raw.trim();
  if (!question || state.busy) return;
  const history = recentHistory();
  state.busy = true;
  $('#send').disabled = true;
  $('#question').value = '';
  const turn = {question, loading: true};
  state.turns.push(turn);
  renderMessages();
  try {
    const response = await fetch('/api/v1/queries', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({question, conversation_context: state.context, history, mode: 'answer'}),
    });
    if (!response.ok) throw await responseError(response);
    const result = await response.json();
    state.context = result.continuation_context || {};
    turn.result = result;
    turn.loading = false;
    renderMessages();
    activateResult(result);
    saveConversation();
  } catch (error) {
    const code = error.code ? `[${error.code}]` : '';
    turn.result = {status: 'refused', answer: null, evidence: [], resolved_scope: {},
      missing_conditions: [], warnings: [`请求失败${code}：${error.message}`]};
    turn.loading = false;
    renderMessages();
    activateResult(turn.result);
    saveConversation();
  } finally {
    state.busy = false;
    $('#send').disabled = false;
    $('#question').focus();
  }
}

$('#queryForm').addEventListener('submit', event => {
  event.preventDefault();
  submit($('#question').value);
});
function resetConversation(render = true) {
  state.conversationId = null;
  state.context = {};
  state.turns = [];
  state.evidence = [];
  state.referenceIds = [];
  state.citedDocs = [];
  state.selectedId = null;
  state.reader = null;
  $('.workspace').classList.remove('reading');
  closeDrawer();
  if (!render) return;
  renderMessages();
  renderEvidence();
  renderHistory();
}
$('#newChat').addEventListener('click', () => { if (!state.busy) resetConversation(); });
$('#sourceToggle').addEventListener('click', openDrawer);
$('#closeSources').addEventListener('click', closeDrawer);
$('#drawerBackdrop').addEventListener('click', closeDrawer);
// Column widths are a per-browser preference.
const LAYOUT_KEY = 'rag.layout.v1';
function initSplitters() {
  const workspace = $('.workspace');
  let layout = {};
  try { layout = JSON.parse(localStorage.getItem(LAYOUT_KEY) || '{}') || {}; } catch { layout = {}; }
  const apply = () => {
    for (const name of ['left', 'right', 'reading']) {
      if (Number.isFinite(layout[name])) workspace.style.setProperty(`--${name}-w`, `${layout[name]}px`);
      else workspace.style.removeProperty(`--${name}-w`);
    }
  };
  const save = () => { try { localStorage.setItem(LAYOUT_KEY, JSON.stringify(layout)); } catch {} };
  const rightName = () => workspace.classList.contains('reading') ? 'reading' : 'right';
  apply();
  document.querySelectorAll('.splitter').forEach(bar => {
    bar.addEventListener('pointerdown', event => {
      event.preventDefault();
      bar.setPointerCapture(event.pointerId);
      bar.classList.add('dragging');
      document.body.classList.add('resizing');
      const box = workspace.getBoundingClientRect();
      const left = $('.left').getBoundingClientRect().width;
      const move = moveEvent => {
        if (bar.dataset.split === 'left') {
          layout.left = Math.round(Math.min(420, Math.max(150, moveEvent.clientX - box.left)));
        } else {
          const max = box.width - left - 354;
          layout[rightName()] = Math.round(Math.min(max, Math.max(300, box.right - moveEvent.clientX)));
        }
        apply();
      };
      const stop = () => {
        bar.removeEventListener('pointermove', move);
        bar.classList.remove('dragging');
        document.body.classList.remove('resizing');
        save();
      };
      bar.addEventListener('pointermove', move);
      bar.addEventListener('pointerup', stop, {once: true});
      bar.addEventListener('pointercancel', stop, {once: true});
    });
    bar.addEventListener('dblclick', () => {
      delete layout[bar.dataset.split === 'left' ? 'left' : rightName()];
      apply();
      save();
    });
  });
}
initSplitters();
loadRuntimeProfile();
renderHistory();
renderMessages();
renderEvidence();
  </script>
</body>
