<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>排水法规标准智能问答系统</title>
  <style>
    :root{--ink:#18231e;--muted:#66756e;--line:#d9e1dc;--paper:#f4f6f2;--panel:#fff;--deep:#10271d;--green:#116447;--soft:#e8f3ed;--lime:#c8ee66;--amber:#945f05;--amber-bg:#fff3d8;--red:#973d35;--red-bg:#fbeae7;--blue:#275f85;--blue-bg:#e9f3f8;--shadow:0 14px 36px rgba(26,45,36,.09)}
    *{box-sizing:border-box}html,body{margin:0;height:100%;color:var(--ink);background:var(--paper);font-family:Inter,"Microsoft YaHei","PingFang SC",system-ui,sans-serif}button,input{font:inherit}button{cursor:pointer}.app{height:100%;display:flex;flex-direction:column}.topbar{height:64px;display:flex;align-items:center;gap:18px;padding:0 22px;background:var(--deep);color:#fff;border-bottom:1px solid #365246}.brand{display:flex;align-items:center;gap:10px;min-width:250px}.mark{display:grid;place-items:center;width:35px;height:35px;border:1px solid #668277;border-radius:10px;color:var(--lime);font-weight:800}.brand strong{font-size:15px}.brand small{display:block;color:#aabdb4;font-size:10px;margin-top:2px}.corpus{flex:1;color:#b7c9c1;font-size:11px}.corpus b{display:block;color:#fff;font-size:12px;margin-bottom:2px}.modes{display:flex;gap:3px;padding:3px;border:1px solid #466256;border-radius:10px}.modes button{border:0;border-radius:7px;padding:7px 10px;background:transparent;color:#c5d4ce;font-size:11px}.modes button.active{background:var(--lime);color:#193122;font-weight:800}
    .workspace{min-height:0;flex:1;display:grid;grid-template-columns:220px minmax(420px,1fr) 390px}.left{padding:19px 15px;background:#f0f3ef;border-right:1px solid var(--line)}.pane-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.pane-head h2{font-size:13px;margin:0}.new{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 9px}.session{padding:11px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:12px;line-height:1.55}.session span{display:block;color:var(--muted);font-size:10px;margin-top:4px}.note{margin-top:18px;padding-top:15px;border-top:1px solid var(--line);color:var(--muted);font-size:11px;line-height:1.7}
    .chat{min-width:0;display:flex;flex-direction:column;background:#fff}.messages{flex:1;overflow:auto;padding:30px clamp(22px,5vw,70px) 18px}.empty{max-width:680px;margin:12vh auto 0}.eyebrow{color:var(--green);font-size:10px;letter-spacing:.12em;font-weight:800;text-transform:uppercase}.empty h1{font:650 32px/1.28 Georgia,"Songti SC",serif;margin:10px 0}.empty p{color:var(--muted);font-size:13px;line-height:1.7}.suggestions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:25px}.suggestion{padding:13px;text-align:left;border:1px solid var(--line);border-radius:11px;background:#fafbf9;color:#33443b;line-height:1.5}.suggestion:hover{border-color:#74a18c;background:var(--soft)}.turn{max-width:820px;margin:0 auto 24px}.user{max-width:78%;margin-left:auto;padding:12px 15px;border-radius:14px 14px 3px 14px;background:#173a2b;color:#fff;font-size:13px;line-height:1.6}.assistant-head{display:flex;align-items:center;gap:8px;color:var(--green);font-size:11px;font-weight:800;margin:17px 0 10px}.assistant-head:before{content:"证";display:grid;place-items:center;width:25px;height:25px;border-radius:8px;background:var(--green);color:#fff}.status{border-left:4px solid var(--green);border-radius:5px 10px 10px 5px;padding:11px 13px;background:var(--soft);font-size:12px;line-height:1.55}.status.needs_clarification{border-color:#cf850c;background:var(--amber-bg)}.status.refused{border-color:#c75a50;background:var(--red-bg)}.status.search_only,.status.conflicting_sources{border-color:#4d87ae;background:var(--blue-bg)}.claim{font:15px/1.85 Georgia,"Songti SC",serif;margin:15px 0}.cite{display:inline-grid;place-items:center;min-width:22px;height:22px;margin-left:4px;padding:0 5px;border:0;border-radius:6px;background:var(--green);color:#fff;font:700 11px/1 system-ui}.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.chip{border:1px solid #c8d5ce;border-radius:999px;background:#fff;padding:6px 10px;color:#42544a;font-size:11px}.chip.action:hover{border-color:var(--green);color:var(--green)}.warning{margin-top:10px;color:var(--muted);font-size:11px}.composer{padding:10px clamp(22px,5vw,70px) 18px;border-top:1px solid var(--line);background:#fff}.query-modes{max-width:820px;margin:0 auto 8px;display:flex;align-items:center;gap:5px}.query-modes span{margin-right:4px;color:var(--muted);font-size:10px}.query-modes button{border:1px solid var(--line);border-radius:999px;padding:5px 9px;background:#fff;color:var(--muted);font-size:10px}.query-modes button.active{border-color:#9bc9b2;background:var(--soft);color:var(--green);font-weight:800}.composer form{max-width:820px;margin:auto;display:flex;gap:8px}.composer input{flex:1;height:46px;border:1px solid #bdcbc4;border-radius:11px;padding:0 14px;outline:none}.composer input:focus{border-color:var(--green);box-shadow:0 0 0 3px #dceee5}.send{border:0;border-radius:10px;background:var(--lime);padding:0 20px;color:#183021;font-weight:800}.send:disabled{opacity:.55;cursor:wait}
    .evidence{overflow:auto;padding:20px;background:#f8f7f2;border-left:1px solid var(--line)}.evidence-empty{margin-top:25vh;color:var(--muted);text-align:center;font-size:12px;line-height:1.7}.source-list{display:grid;gap:8px;margin-bottom:16px}.source-card{width:100%;text-align:left;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff}.source-card.active{border-color:var(--green);box-shadow:inset 3px 0 var(--green)}.source-card strong{display:block;font-size:11px;line-height:1.45}.source-card span{color:var(--muted);font-size:10px}.detail{padding-top:15px;border-top:1px solid var(--line)}.detail h3{font:650 18px/1.45 Georgia,"Songti SC",serif;margin:8px 0 13px}.meta{display:grid;grid-template-columns:70px 1fr;gap:7px;font-size:11px}.meta dt{color:var(--muted)}.meta dd{margin:0;overflow-wrap:anywhere}.quote{margin:17px 0;padding:14px;border:1px solid var(--line);border-left:4px solid var(--green);background:#fff;font:13px/1.8 Georgia,"Songti SC",serif;white-space:pre-wrap}.source-actions{display:grid;gap:8px}.open-source{display:block;text-align:center;text-decoration:none;border:1px solid var(--line);border-radius:9px;padding:9px;background:#fff;color:var(--green);font-size:12px}.open-source.primary{border-color:var(--green);background:var(--green);color:#fff}.loading{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}.loading:before{content:"";width:14px;height:14px;border:2px solid #ccd8d1;border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    .mode-b .workspace{grid-template-columns:minmax(460px,1fr) minmax(420px,.85fr)}.mode-b .left{display:none}.mode-b .evidence{grid-column:1;grid-row:1;border-left:0;border-right:1px solid var(--line)}.mode-b .chat{grid-column:2;grid-row:1}.mode-c .workspace{display:grid;grid-template-columns:minmax(520px,1fr)}.mode-c .left{display:none}.mode-c .evidence{border-left:0;border-top:1px solid var(--line);padding:20px clamp(22px,5vw,70px)}.mode-c .source-list{grid-template-columns:repeat(3,1fr)}.mode-c .detail{max-width:900px}.mode-c .messages{padding-bottom:25px}
    @media(max-width:1020px){.workspace{grid-template-columns:180px 1fr}.evidence{display:none}.mode-b .workspace{display:block}.mode-b .evidence{display:none}.mode-b .chat{min-height:calc(100vh - 64px)}.mode-c .evidence{display:block}.mode-c .source-list{grid-template-columns:1fr 1fr}}@media(max-width:700px){.topbar{height:auto;min-height:64px;flex-wrap:wrap;padding:10px 12px}.brand{min-width:0}.corpus{order:3;min-width:100%}.workspace{display:block}.left{display:none}.chat{height:calc(100vh - 98px)}.messages{padding:20px 14px}.composer{padding:10px 12px}.suggestions{grid-template-columns:1fr}.empty{margin-top:5vh}.empty h1{font-size:26px}.modes button{padding:6px 8px}.mode-c .evidence{display:none}}
  </style>
</head>
<body>
  <div id="app" class="app mode-a">
    <header class="topbar">
      <div class="brand"><div class="mark">排</div><div><strong>排水法规标准智能问答系统</strong><small>Drainage RAG workspace</small></div></div>
      <div class="corpus"><b>当前发布语料</b>回答、引用与原文定位使用同一查询核心 · <a href="/formulas" style="color:#c8ee66">公式对照（待复核）</a></div>
      <div class="modes" aria-label="界面模式"><button data-mode="a" class="active">A 对话</button><button data-mode="b">B 对照</button><button data-mode="c">C 证据板</button></div>
    </header>
    <main class="workspace">
      <aside class="left"><div class="pane-head"><h2>当前对话</h2><button id="newChat" class="new">＋ 新对话</button></div><div class="session">规范问答<span id="turnCount">尚未提问</span></div><p class="note">地域、效力和统计时段由查询核心解析。条件不足时会追问；证据不足时不会使用模型记忆补齐。</p></aside>
      <section class="chat"><div id="messages" class="messages"></div><div class="composer"><div class="query-modes"><span>查询方式</span><button data-query-mode="answer" class="active">证据化回答</button><button data-query-mode="source_lookup">只找原文</button></div><form id="queryForm" aria-label="提交问题"><input id="question" autocomplete="off" placeholder="输入规范、政策或监测问题…"><button id="send" class="send" type="submit">发送</button></form></div></section>
      <aside class="evidence"><div class="pane-head"><h2>原文证据</h2><span id="evidenceCount" class="chip">0 条</span></div><div id="evidencePanel"></div></aside>
    </main>
  </div>
  <script>
    const state={context:{},turns:[],evidence:[],selected:0,busy:false,queryMode:'answer'};
    const $=s=>document.querySelector(s);
    const node=(tag,className,text)=>{const n=document.createElement(tag);if(className)n.className=className;if(text!==undefined)n.textContent=text;return n};
    const statusText={answered:'已基于证据回答',needs_clarification:'需要补充条件',search_only:'请查看原文',conflicting_sources:'来源存在冲突',refused:'当前证据不足'};
    function setQueryMode(mode){state.queryMode=mode;document.querySelectorAll('[data-query-mode]').forEach(b=>b.classList.toggle('active',b.dataset.queryMode===mode));$('#question').placeholder=mode==='source_lookup'?'输入需要定位原文页的问题…':'输入规范、政策或监测问题…'}
    function renderEmpty(){const box=node('div','empty');box.append(node('p','eyebrow','排水法规 · 政策 · 标准'));box.append(node('h1','', '先找到依据，再形成回答'));box.append(node('p','', '回答中的每项事实都必须能回到文档、条款或表格和物理页。你可以继续追问，条件会显式传递。'));const list=node('div','suggestions');[{text:'降水量为20毫米时属于什么等级？',mode:'answer'},{text:'武汉市混错接改造项目的评估周期有什么要求？',mode:'answer'},{text:'重庆地块项目评价中，基础工作包含哪些材料？',mode:'answer'},{text:'采用用水量折算法时，原文公式在哪里？',mode:'source_lookup'}].forEach(item=>{const b=node('button','suggestion',item.text);b.addEventListener('click',()=>{setQueryMode(item.mode);submit(item.text)});list.append(b)});box.append(list);$('#messages').replaceChildren(box)}
    async function selectEvidence(index){state.selected=index;renderEvidence();document.querySelectorAll('.cite').forEach(b=>b.classList.toggle('active',Number(b.dataset.index)===index));const current=state.evidence[index];if(!current?.evidence_id)return;try{const response=await fetch(`/api/v1/evidence/${encodeURIComponent(current.evidence_id)}`);if(response.ok){state.evidence[index]=await response.json();renderEvidence()}}catch(error){console.warn('无法刷新证据详情',error)}}
    async function responseError(response){try{const payload=await response.json();const error=new Error(payload.error?.message||`HTTP ${response.status}`);error.code=payload.error?.code||'http_error';return error}catch{return new Error(`HTTP ${response.status}`)}}
    function renderTurn(turn){const wrap=node('article','turn');wrap.append(node('div','user',turn.question));if(turn.loading){const h=node('div','assistant-head','排水法规助手');wrap.append(h,node('div','loading','正在检索并核验证据…'));return wrap}const r=turn.result;wrap.append(node('div','assistant-head','排水法规助手'));const status=node('div',`status ${r.status}`);status.append(node('strong','',statusText[r.status]||r.status));const detail={needs_clarification:'当前条件会改变结论，请补充后继续。',refused:'当前语料不能直接支持这个问题，系统没有拼凑答案。',search_only:'转写未通过回答门控，请直接查看定位页。',conflicting_sources:'分别展示各来源，不替你裁决。',answered:'以下主张均绑定了本次证据。'}[r.status];status.append(node('div','',detail));wrap.append(status);if(r.answer){r.answer.claims.forEach(claim=>{const p=node('p','claim',claim.text);claim.evidence_ids.forEach(id=>{const idx=state.evidence.findIndex(e=>e.evidence_id===id);if(idx>=0){const b=node('button','cite',String(idx+1));b.dataset.index=idx;b.title='查看原文证据';b.addEventListener('click',()=>selectEvidence(idx));p.append(b)}});wrap.append(p)})}if(r.status==='needs_clarification'&&r.missing_conditions.includes('statistical_period')){const chips=node('div','chips');['12小时','24小时'].forEach(text=>{const b=node('button','chip action',text);b.addEventListener('click',()=>submit(text));chips.append(b)});wrap.append(chips)}if(r.resolved_scope&&Object.keys(r.resolved_scope).length){const chips=node('div','chips');Object.entries(r.resolved_scope).forEach(([k,v])=>chips.append(node('span','chip',`${k}：${v}`)));wrap.append(chips)}if(r.warnings?.length)wrap.append(node('p','warning',r.warnings.join('；')));return wrap}
    function renderMessages(){const root=$('#messages');if(!state.turns.length){renderEmpty();return}root.replaceChildren(...state.turns.map(renderTurn));root.scrollTop=root.scrollHeight;$('#turnCount').textContent=`${state.turns.filter(t=>!t.loading).length} 轮问答`}
    function renderRegionSources(detail,e){for(const region of e.source_regions||[]){if(!/^(up-[0-9a-f]{24}|chunk_[0-9a-f]{32}__p\d+)$/.test(region.region_id||''))continue;const figure=node('figure','region-source');figure.append(node('figcaption','',`原PDF${({formula:'公式',table:'表格',image:'图片'})[region.kind]||'区域'} · 物理页 ${region.physical_page}`));const image=node('img','');image.src=`/api/v1/regions/${region.region_id}/image`;image.alt=`${e.file_name} 第 ${region.physical_page} 页原图`;image.loading='lazy';image.style.maxWidth='100%';image.style.height='auto';figure.append(image,node('p','',region.quality_status==='passed'?'原文区域':'自动提取及关联仍需对照原图核对'));detail.append(figure)}}
    function renderEvidence(){const root=$('#evidencePanel');$('#evidenceCount').textContent=`${state.evidence.length} 条`;if(!state.evidence.length){root.replaceChildren(node('div','evidence-empty','提交问题后，这里展示回答所依据的原文、文档名称、位置和页码。'));return}const list=node('div','source-list');state.evidence.forEach((e,i)=>{const b=node('button',`source-card ${i===state.selected?'active':''}`);b.append(node('strong','',`[${i+1}] ${e.file_name||'未命名文档'}`),node('span','',`${e.heading_path?.join(' › ')||'位置待补充'} · 第 ${e.physical_pages?.join('、')||'?'} 页`));b.addEventListener('click',()=>selectEvidence(i));list.append(b)});const e=state.evidence[state.selected]||state.evidence[0];const d=node('div','detail');d.append(node('p','eyebrow',e.usage_policy==='source_locator_only'?'原文定位':'可引用证据'),node('h3','',e.file_name||'未命名文档'));const dl=node('dl','meta');[['发布机关',e.source_authority||'未知'],['地域',e.jurisdiction||'未知'],['效力状态',e.effective_status||'未知'],['位置',e.heading_path?.join(' › ')||'未识别'],['物理页',e.physical_pages?.join('、')||'未知']].forEach(([k,v])=>{dl.append(node('dt','',k),node('dd','',v))});d.append(dl,node('blockquote','quote',e.text));renderRegionSources(d,e);const actions=node('div','source-actions');if(e.document_version_id){const page=e.physical_pages?.[0]||1;const local=node('a','open-source primary',`打开本地 PDF · 第 ${page} 页`);local.href=`/api/v1/documents/${encodeURIComponent(e.document_version_id)}/content#page=${page}`;local.target='_blank';local.rel='noopener';actions.append(local)}if(e.source_uri){const official=node('a','open-source','打开官方原文');official.href=e.source_uri;official.target='_blank';official.rel='noopener';actions.append(official)}if(actions.childNodes.length)d.append(actions);root.replaceChildren(list,d)}
    async function submit(raw){const question=raw.trim();if(!question||state.busy)return;state.busy=true;$('#send').disabled=true;$('#question').value='';state.turns.push({question,loading:true});renderMessages();try{const response=await fetch('/api/v1/queries',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question,conversation_context:state.context,mode:state.queryMode})});if(!response.ok)throw await responseError(response);const result=await response.json();state.context=result.continuation_context||{};state.evidence=result.evidence||[];state.selected=0;state.turns[state.turns.length-1]={question,result};renderMessages();renderEvidence()}catch(error){const code=error.code?`[${error.code}]`:'';state.turns[state.turns.length-1]={question,result:{status:'refused',answer:null,evidence:[],resolved_scope:{},missing_conditions:[],warnings:[`请求失败${code}：${error.message}`]}};renderMessages()}finally{state.busy=false;$('#send').disabled=false;$('#question').focus()}}
    $('#queryForm').addEventListener('submit',e=>{e.preventDefault();submit($('#question').value)});$('#newChat').addEventListener('click',()=>{state.context={};state.turns=[];state.evidence=[];state.selected=0;setQueryMode('answer');renderMessages();renderEvidence()});document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-mode]').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#app').className=`app mode-${b.dataset.mode}`}));document.querySelectorAll('[data-query-mode]').forEach(b=>b.addEventListener('click',()=>setQueryMode(b.dataset.queryMode)));renderMessages();renderEvidence();
  </script>
</body>
</html>
