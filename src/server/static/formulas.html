<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>公式对照 · 排水法规标准智能问答系统</title>
<style>
body{margin:0;background:#f4f6f2;color:#18231e;font:15px/1.7 system-ui,"Microsoft YaHei",sans-serif}header{background:#10271d;color:#fff;padding:18px 5vw}header a{color:#c8ee66}main{max-width:1100px;margin:28px auto;padding:0 20px}.notice{padding:16px;background:#fff3d8;border-left:4px solid #945f05}article{background:#fff;border:1px solid #d9e1dc;border-radius:12px;margin:20px 0;padding:24px}h1{font-size:26px}h2{font-size:19px}.status{color:#945f05}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#eef3ee;padding:16px;border-radius:8px}table{width:100%;border-collapse:collapse}th,td{text-align:left;border-bottom:1px solid #d9e1dc;padding:10px}a{color:#116447}small{color:#66756e}button{padding:8px 18px;cursor:pointer}@media(max-width:600px){article{padding:15px}table{font-size:12px}th,td{padding:6px}}
</style></head>
<body><header><a href="/">← 返回问答</a> · 排水法规标准智能问答系统</header>
<main><h1>公式与原页对照</h1><p class="notice">识别转写待复核 · 不可计算。这里是只读识别预览，不是正式回答语料；变量核验不等于公式批准。显示原始 LaTeX，不执行或渲染不受信任的公式代码。</p>
<p><a href="/formula-review">查看全量数学区域对照（均待复核）</a></p><button id="reload">刷新结果</button><p id="message" role="status"></p><section id="items" aria-label="公式列表"></section></main>
<script>
const make=(tag,text)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;return n};
function card(r){const a=make('article');a.append(make('h2',r.formula_number),make('p',`${r.file_name} · 物理页 ${r.physical_page}`));const s=make('p',r.status==='pending_review'?'转写待复核 · 不可计算':'仅原页定位 · 暂无有效转写');s.className='status';a.append(s);if(r.raw_latex)a.append(make('pre',r.raw_latex));
if(r.variable_definitions.length){const t=make('table'),head=make('tr');['变量','原页核对说明','原文单位'].forEach(x=>head.append(make('th',x)));t.append(head);r.variable_definitions.forEach(v=>{const row=make('tr');[v.symbol,v.definition,v.unit??'原文未列单位'].forEach(x=>row.append(make('td',x)));t.append(row)});a.append(t,make('small','以上说明来自人工原图核对记录；保留原页依据，不授权计算。'))}
if(r.conditions.length){a.append(make('h3','已核对的局部约束'));const list=make('ul');r.conditions.forEach(c=>list.append(make('li',c.text)));a.append(list)}
a.append(make('p',`仍待核验：${r.missing_context.map(x=>({verified_variables:'变量完整性',verified_units:'单位完整性',verified_conditions:'完整适用条件'}[x]||x)).join('、')||'公式整体与计算许可'}`));
if(r.source_url&&/^\/api\/v1\/documents\/doc_[0-9a-f]{16}\/content#page=\d+$/.test(r.source_url)){const link=make('a',`打开原 PDF · 第 ${r.physical_page} 页`);link.href=r.source_url;link.target='_blank';link.rel='noopener';a.append(link)}return a}
async function load(){const root=document.querySelector('#items'),message=document.querySelector('#message');root.replaceChildren();message.textContent='正在读取已有识别结果…';try{const response=await fetch('/api/v1/formulas');if(!response.ok)throw Error();const data=await response.json();for(const item of data.items){const detail=await fetch(`/api/v1/formulas/${encodeURIComponent(item.anchor_id)}`);if(!detail.ok)throw Error();root.append(card(await detail.json()))}message.textContent=data.items.length?`${data.items.length} 条只读预览`:'暂无登记公式；添加资料不会自动批准公式。'}catch(error){message.textContent='公式预览暂不可用，请稍后重试；现有问答不受影响。'}}
document.querySelector('#reload').addEventListener('click',load);load();
</script></body></html>
