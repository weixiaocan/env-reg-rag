# Reverse proxy for the RAG demo. Replace rag.example.com, then obtain a
# certificate (e.g. certbot --nginx -d rag.example.com).
limit_req_zone $binary_remote_addr zone=rag_api:10m rate=30r/m;

server {
    listen 80;
    server_name rag.example.com;

    client_max_body_size 64k;

    location /api/v1/queries {
        limit_req zone=rag_api burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        # Overwrite (never append) so visitors cannot spoof their address;
        # the app counts daily quota per this address.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_read_timeout 150s;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }
}
