services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    container_name: ${QDRANT_CONTAINER_NAME:-env-reg-rag-qdrant}
    restart: unless-stopped
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    ports:
      - "127.0.0.1:${QDRANT_HTTP_HOST_PORT:-6333}:6333"
      - "127.0.0.1:${QDRANT_GRPC_HOST_PORT:-6334}:6334"
    volumes:
      - env_reg_rag_qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ': > /dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  app:
    build: .
    image: ${APP_IMAGE_NAME:-env-reg-rag-app:local}
    container_name: ${APP_CONTAINER_NAME:-env-reg-rag-app}
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_HTTP_HOST_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-corpus_v2}
    volumes:
      - ./data/registry:/app/data/registry:ro
      - ./data/canonical:/app/data/canonical:ro
      - ./data/raw:/app/data/raw:ro
      - ./data/model_runtime:/app/data/model_runtime:ro
      - ./data/observability:/app/data/observability

volumes:
  env_reg_rag_qdrant_storage:
    name: ${QDRANT_VOLUME_NAME:-env-reg-rag-qdrant-storage}