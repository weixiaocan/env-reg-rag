services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    container_name: ${QDRANT_CONTAINER_NAME:-env-reg-rag-qdrant}
    restart: unless-stopped
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    ports:
      - "127.0.0.1:${QDRANT_HTTP_HOST_PORT:-6333}:6333"
      - "127.0.0.1:${QDRANT_GRPC_HOST_PORT:-6334}:6334"
    volumes:
      - env_reg_rag_qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ': > /dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # V2 retrieval HTTP API / app service is not yet provided. The Qdrant service
  # above is the only runtime dependency; V2 ingestion and retrieval run via
  # scripts/ingest_corpus_v2.py against this Qdrant instance. Add an `app`
  # service here once the V2 retrieval service is built.

volumes:
  env_reg_rag_qdrant_storage:
    name: ${QDRANT_VOLUME_NAME:-env-reg-rag-qdrant-storage}
